<!DOCTYPE html>
<html lang="en">
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
  

</head>

<body>
    <header>
        <div class="logo_container">
            <a href="#"><img src="Img/myntra_logo.webp" class="myntra_home" alt=""></a>
        </div>
        <div class="nav_bar ">
            <a href="">Men</a>
            <a href="">Women</a>
            <a href="">Kids</a>
            <a href="">Men</a>
            <a href="">Home & Living</a>
            <a href="">Beauty</a>
            <a href="">Studio <sup>New</sup></a>
        </div>
        <div class="search_bar"><span class="material-symbols-outlined search_icon">
                search
            </span>
            <input type="text" class="search_input" placeholder="Search for products, brands and more...">
        </div>
        <div class="action_bar">
            <div class="action_container">
                <span class="material-symbols-outlined">
                    person
                </span>
                <span class="action_name">Profile</span>
            </div>
            <div class="action_container">
                <span class="material-symbols-outlined">
                    favorite
                </span>
                <span class="action_name">Wishlist</span>
            </div>
            <div class="action_container">
                <span class="material-symbols-outlined">
                    shopping_bag
                </span>
                <span class="action_name">Bag</span>
            </div>
        </div>
    </header>
    <main>

        <div class="banner_container">Banner Container</div>
        <div class="category_heading">Category Heading</div>
        <div class="category_items">Category items</div>

    </main>
    <footer>
        Fotter
    </footer>

</body>
<script src="script.js"></script>

</html>
